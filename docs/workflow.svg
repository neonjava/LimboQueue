<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-label="Workflow for LimboQueue: Player joins the proxy, Backend capacity is checked, Player waits in limbo, Move to server when ready">
<title>LimboQueue workflow</title><desc>Player joins the proxy → Backend capacity is checked → Player waits in limbo → Move to server when ready</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091322"/><stop offset="1" stop-color="#111a2c"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#85b9ff" stop-opacity=".22"/><stop offset="1" stop-color="#85b9ff" stop-opacity="0"/></radialGradient>
</defs>
<style>
text { font-family: Inter, Arial, sans-serif; }
.flow { animation: move 1.2s linear infinite; }
.beacon { animation: pulse 2.2s ease-in-out infinite; }
@keyframes move { to { stroke-dashoffset: -20; } }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .flow,.beacon { animation: none; } }
</style>
<rect width="1200" height="410" rx="24" fill="url(#bg)"/>
<circle cx="1100" cy="0" r="270" fill="url(#glow)"/>
<circle cx="0" cy="410" r="180" fill="url(#glow)" opacity=".4"/>
<text x="34" y="42" fill="#85b9ff" font-size="12" font-weight="700" letter-spacing="3">HOW IT WORKS</text>
<text x="34" y="83" fill="#f3f6fb" font-size="31" font-weight="700">LimboQueue</text>
<rect x="925" y="38" width="240" height="36" rx="18" fill="#19273b" stroke="#33455d"/>
<circle class="beacon" cx="946" cy="56" r="5" fill="#85b9ff"/>
<text x="963" y="61" fill="#c9d7e7" font-size="14">Minecraft network</text>
<path d="M290 220 H326" stroke="#85b9ff" stroke-width="2" stroke-dasharray="5 5" class="flow"/>
          <path d="m319 214 7 6-7 6" fill="none" stroke="#85b9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 220 H620" stroke="#85b9ff" stroke-width="2" stroke-dasharray="5 5" class="flow"/>
          <path d="m613 214 7 6-7 6" fill="none" stroke="#85b9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M878 220 H914" stroke="#85b9ff" stroke-width="2" stroke-dasharray="5 5" class="flow"/>
          <path d="m907 214 7 6-7 6" fill="none" stroke="#85b9ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<g class="card c0" aria-label="Step 1: Player joins the proxy">
          <rect x="32" y="112" width="258" height="218" rx="22" fill="#111d31" stroke="#324259" stroke-width="1.5"/>
          <rect x="33" y="113" width="256" height="5" rx="3" fill="#85b9ff" opacity=".9"/>
          <circle cx="81" cy="167" r="32" fill="#85b9ff" opacity=".13"/>
          <g transform="translate(57 143)" fill="none" stroke="#85b9ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="15" r="7"/><path d="M4 39c0-12 26-12 26 0M31 9c10-2 13 13 3 14M34 29c7 1 10 5 10 10"/></g>
          <text x="253" y="159" text-anchor="end" fill="#8090a7" font-size="15" font-weight="700">01</text>
          <text x="54" y="238" fill="#f2f6fc" font-size="20" font-weight="650"><tspan x="54" dy="0">Player joins the</tspan><tspan x="54" dy="26">proxy</tspan></text>
          <rect x="54" y="300" width="117" height="1" fill="#85b9ff" opacity=".65"/>
          <text x="54" y="316" fill="#9aaec5" font-size="11" font-weight="700" letter-spacing="2">INPUT</text>
        </g><g class="card c1" aria-label="Step 2: Backend capacity is checked">
          <rect x="326" y="112" width="258" height="218" rx="22" fill="#111d31" stroke="#324259" stroke-width="1.5"/>
          <rect x="327" y="113" width="256" height="5" rx="3" fill="#85b9ff" opacity=".9"/>
          <circle cx="375" cy="167" r="32" fill="#85b9ff" opacity=".13"/>
          <g transform="translate(351 143)" fill="none" stroke="#85b9ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="6" width="36" height="15" rx="3"/><rect x="6" y="27" width="36" height="15" rx="3"/><path d="M13 13h1M13 34h1M21 13h14M21 34h14"/></g>
          <text x="547" y="159" text-anchor="end" fill="#8090a7" font-size="15" font-weight="700">02</text>
          <text x="348" y="238" fill="#f2f6fc" font-size="20" font-weight="650"><tspan x="348" dy="0">Backend capacity is</tspan><tspan x="348" dy="26">checked</tspan></text>
          <rect x="348" y="300" width="135" height="1" fill="#85b9ff" opacity=".65"/>
          <text x="348" y="316" fill="#9aaec5" font-size="11" font-weight="700" letter-spacing="2">PROCESS</text>
        </g><g class="card c2" aria-label="Step 3: Player waits in limbo">
          <rect x="620" y="112" width="258" height="218" rx="22" fill="#111d31" stroke="#324259" stroke-width="1.5"/>
