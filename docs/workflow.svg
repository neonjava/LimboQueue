          <circle cx="669" cy="167" r="32" fill="#85b9ff" opacity=".13"/>
          <g transform="translate(645 143)" fill="none" stroke="#85b9ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 10h30M9 19h25M9 28h20M9 37h15"/><circle cx="39" cy="36" r="5"/></g>
          <text x="841" y="159" text-anchor="end" fill="#8090a7" font-size="15" font-weight="700">03</text>
          <text x="642" y="238" fill="#f2f6fc" font-size="20" font-weight="650"><tspan x="642" dy="0">Player waits in</tspan><tspan x="642" dy="26">limbo</tspan></text>
          <rect x="642" y="300" width="126" height="1" fill="#85b9ff" opacity=".65"/>
          <text x="642" y="316" fill="#9aaec5" font-size="11" font-weight="700" letter-spacing="2">ACTION</text>
        </g><g class="card c3" aria-label="Step 4: Move to server when ready">
          <rect x="914" y="112" width="258" height="218" rx="22" fill="#111d31" stroke="#324259" stroke-width="1.5"/>
          <rect x="915" y="113" width="256" height="5" rx="3" fill="#85b9ff" opacity=".9"/>
          <circle cx="963" cy="167" r="32" fill="#85b9ff" opacity=".13"/>
          <g transform="translate(939 143)" fill="none" stroke="#85b9ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="24" r="5"/><circle cx="36" cy="24" r="5"/><path d="M17 24h14m-7-7 7 7-7 7"/></g>
          <text x="1135" y="159" text-anchor="end" fill="#8090a7" font-size="15" font-weight="700">04</text>
          <text x="936" y="238" fill="#f2f6fc" font-size="20" font-weight="650"><tspan x="936" dy="0">Move to server when</tspan><tspan x="936" dy="26">ready</tspan></text>
          <rect x="936" y="300" width="126" height="1" fill="#85b9ff" opacity=".65"/>
          <text x="936" y="316" fill="#9aaec5" font-size="11" font-weight="700" letter-spacing="2">RESULT</text>
        </g>
<path d="M34 364 H1166" stroke="#2c3b51" stroke-width="1"/>
<text x="34" y="387" fill="#91a4bb" font-size="13">01  START</text>
<text x="1062" y="387" fill="#85b9ff" font-size="13" font-weight="700">04  RESULT</text>
</svg>
